{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block page %}error{% endblock %}

{% block content %}
<div class="container">
  <section class="panel error-panel">
    <p class="eyebrow">Error {{ status }}</p>
    <h1 class="h1-sm">{{ message }}</h1>
    <p><a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to the scanner</a></p>
  </section>
</div>
{% endblock %}
